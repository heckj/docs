<script>
(function () {
  var LOGO_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 25" width="22" height="22" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12.5.5a12,12,0,1,0,12,12A12,12,0,0,0,12.5.5ZM1.525,13H6.014a20.83,20.83,0,0,0,.469,4.031h-4A10.924,10.924,0,0,1,1.525,13ZM13,6.969V1.552c1.734.339,3.32,2.417,4.222,5.417Zm4.49,1a19.808,19.808,0,0,1,.5,4.031H13V7.969ZM12,1.552V6.969H7.778C8.68,3.969,10.266,1.891,12,1.552Zm0,6.417V12H7.013a19.808,19.808,0,0,1,.5-4.031ZM6.014,12H1.525a10.924,10.924,0,0,1,.96-4.031h4A20.83,20.83,0,0,0,6.014,12Zm1,1H12v4.031H7.51A19.808,19.808,0,0,1,7.013,13ZM12,18.031v5.417c-1.734-.339-3.32-2.417-4.222-5.417Zm1,5.417V18.031h4.222C16.32,21.031,14.734,23.109,13,23.448Zm0-6.417V13h4.987a19.808,19.808,0,0,1-.5,4.031ZM18.986,13h4.489a10.924,10.924,0,0,1-.96,4.031h-4A20.83,20.83,0,0,0,18.986,13Zm0-1a20.83,20.83,0,0,0-.469-4.031h4A10.924,10.924,0,0,1,23.475,12ZM22,6.969H18.265A11.6,11.6,0,0,0,15.6,1.951,11.007,11.007,0,0,1,22,6.969ZM9.4,1.951A11.6,11.6,0,0,0,6.735,6.969H3A11.007,11.007,0,0,1,9.4,1.951ZM3,18.031H6.735A11.6,11.6,0,0,0,9.4,23.049,11.007,11.007,0,0,1,3,18.031Zm12.6,5.018a11.6,11.6,0,0,0,2.665-5.018H22A11.007,11.007,0,0,1,15.6,23.049Z"/></svg>';

  // The Navigator sidebar is rendered client-side by swift-docc-render (Vue),
  // not present in this page's initial HTML, so it may not exist yet when
  // this script runs — retry via MutationObserver until it mounts.
  function insertLogoLink() {
    var headWrapper = document.querySelector('.navigator .head-wrapper');
    if (!headWrapper || headWrapper.querySelector('.sidebar-swift-logo')) {
      return false;
    }
    var link = document.createElement('a');
    link.href = 'https://www.swift.org';
    link.className = 'sidebar-swift-logo';
    link.setAttribute('aria-label', 'Swift.org');
    link.innerHTML = LOGO_SVG;
    headWrapper.insertBefore(link, headWrapper.firstChild);
    return true;
  }

  // Styled on the main document, not this template's own shadow root: the
  // Navigator sidebar this targets lives outside this custom element's
  // shadow tree, in the app's regular (light) DOM.
  var style = document.createElement('style');
  style.textContent = '.sidebar-swift-logo{display:flex;flex-shrink:0;align-items:center;color:var(--color-text);padding-block-start:10px;}';
  document.head.appendChild(style);

  if (!insertLogoLink()) {
    var observer = new MutationObserver(function () {
      if (insertLogoLink()) {
        observer.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }
})();
</script>
